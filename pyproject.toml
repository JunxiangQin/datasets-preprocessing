[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datasets-preprocessing"
version = "0.1.0"
description = "A small, extensible dataset preprocessing pipeline"
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[project.scripts]
datasets-preprocess = "datasets_preprocessing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
